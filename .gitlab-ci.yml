image: fedora:latest

stages:
- check
- lint

sast:
  stage: check
include:
- template: Security/SAST.gitlab-ci.yml

goblint:
  stage: lint
  needs: []
  image:
    name: ghcr.io/bilelmoussaoui/goblint:latest
    entrypoint: ['']
  script:
    - goblint --format sarif > goblint.sarif
  artifacts:
    reports:
      sast: goblint.sarif

codespell:
  stage: check
  script:
    - dnf install -y codespell
    - codespell src -L crate -S "*.png,*.po,.git,*.jpg,eff_large_wordlist.txt,.mypy_cache,_build" -f

