image: fedora:latest

stages:
- check
- lint

cppcheck:
  stage: lint
  script:
    - dnf install -y meson ninja-build gcc cppcheck glib2-devel gtk4-devel
      evolution-data-server-devel gstreamer1-devel libsoup3-devel
      libportal-gtk4-devel libpsl-devel nss-devel json-glib-devel
      webkitgtk6.0-devel blueprint-compiler gettext itstool pcre2-devel
      gsettings-desktop-schemas-devel desktop-file-utils
    - meson setup build
    - ninja -C build
    - tests/run-cppcheck.sh build

sast:
  stage: check
include:
- template: Security/SAST.gitlab-ci.yml

goblint:
  stage: lint
  allow_failure: true
  image:
    name: "ghcr.io/bilelmoussaoui/goblint:latest"
    entrypoint: [""]
  script:
    # Only available in Enterprise Edition
    - goblint --format sarif > goblint.sarif
    # Available in the Community Edition
    - goblint --format gitlab-codequality > goblint-codequality.json
  artifacts:
    expire_in: "1 week"
    reports:
      # Only available in Enterprise Edition
      sarif: goblint.sarif
      # Available in the Community Edition
      codequality: goblint-codequality.json

codespell:
  stage: check
  script:
    - dnf install -y codespell
    - codespell src -L crate -S "*.png,*.po,.git,*.jpg,eff_large_wordlist.txt,.mypy_cache,_build" -f

check-code-style:
  stage: check
  script:
    - dnf install -y uncrustify diff blueprint-compiler
    - bash data/check-code-style
  artifacts:
    when: on_failure

check-pot-files:
  stage: check
  script:
    - bash data/check-potfiles
  artifacts:
    when: on_failure
