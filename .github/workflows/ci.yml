name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check every commit
        run: tools/check-commit-messages --all

      - name: Check the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | tools/check-commit-messages -

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      # aarch64 is for phones (Droidian and the like); a failure there
      # shouldn't hide the x86_64 result, or the other way round.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.steeb_k.Post.json
          bundle: io.github.steeb_k.Post-${{ matrix.arch }}.flatpak
          # Given verbatim: the default tags the bundle name with the arch again.
          artifact-name: io.github.steeb_k.Post-${{ matrix.arch }}.flatpak
          branch: stable
          arch: ${{ matrix.arch }}

      - name: Pack the build repo
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -C repo -cf flatpak-build-${{ matrix.arch }}.tar .

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: flatpak-build-${{ matrix.arch }}
          path: flatpak-build-${{ matrix.arch }}.tar
          retention-days: 7

  release:
    name: Attach the build to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [messages, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n "s/^ *version: '\(.*\)',$/\1/p" meson.build | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match meson.build version $version." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The publisher takes one build repo per release and publishes every
      # arch it finds in it, so the per-arch repos are pulled into one.
      - name: Merge the build repos
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ostree
          ostree init --repo=repo --mode=archive-z2
          for tar in artifacts/flatpak-build-*.tar; do
            arch=$(basename "$tar" .tar | sed 's/^flatpak-build-//')
            mkdir "build-$arch"
            tar -C "build-$arch" -xf "$tar"
            ostree pull-local --repo=repo "build-$arch"
            rm -rf "build-$arch" "$tar"
          done
          ostree refs --repo=repo
          tar -C repo -cf artifacts/flatpak-build.tar .

      # steeb-k/kznjk-flatpak picks the build up from here, signs it and
      # publishes it to apps.kznjk.com.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha=$(sha256sum artifacts/flatpak-build.tar | cut -d' ' -f1)
          printf '{"app_id": "io.github.steeb_k.Post", "branch": "stable", "tar_sha256": "%s"}\n' "$sha" \
            > flatpak-build.json
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Post ${TAG#v}" --notes ""
          fi
          gh release upload "$TAG" --clobber artifacts/flatpak-build.tar \
            artifacts/io.github.steeb_k.Post-*.flatpak
          # The json goes last: the publisher waits for it, so it never takes
          # a build whose tarball is still uploading.
          gh release upload "$TAG" --clobber flatpak-build.json
