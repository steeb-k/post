name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    name: No AI attribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check every commit
        run: tools/check-commit-messages --all

      - name: Check the pull request
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | tools/check-commit-messages -

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.steeb_k.Post.json
          bundle: io.github.steeb_k.Post.flatpak
          branch: stable

      - name: Pack the build repo
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -C repo -cf build-repo.tar .

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: build-repo
          path: build-repo.tar
          retention-days: 7

  publish:
    name: Publish to apps.kznjk.com
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attribution, flatpak]
    runs-on: ubuntu-24.04
    environment: flatpak-repo
    permissions:
      contents: write
    concurrency:
      group: flatpak-repo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n "s/^ *version: '\(.*\)',$/\1/p" meson.build | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match meson.build version $version." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Install flatpak and ostree
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - name: Sign and pack the repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: tools/flatpak-publish.sh artifacts/build-repo.tar release

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The json goes last: the server waits for it, so it never sees a
          # release whose tarball is still uploading.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Post ${TAG#v}" --notes ""
          fi
          gh release upload "$TAG" --clobber release/flatpak-repo.tar \
            artifacts/io.github.steeb_k.Post.flatpak
          gh release upload "$TAG" --clobber release/flatpak-repo.json
